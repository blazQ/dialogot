name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "assets/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "assets/**"

env:
  GODOT_VERSION: "4.6"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install gdtoolkit
        run: pip install gdtoolkit==4.*

      - name: Lint plugin
        run: gdlint addons/dialogot/

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Godot ${{ env.GODOT_VERSION }}
        run: |
          wget -q "https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-stable/Godot_v${{ env.GODOT_VERSION }}-stable_linux.x86_64.zip"
          unzip -q "Godot_v${{ env.GODOT_VERSION }}-stable_linux.x86_64.zip"
          mv "Godot_v${{ env.GODOT_VERSION }}-stable_linux.x86_64" godot
          chmod +x godot

      - name: Import project
        run: timeout 60 ./godot --headless --editor --quit 2>&1 || true

      - name: Run tests
        run: ./godot --headless -s tests/run_tests.gd
